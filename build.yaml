include:
  - board: mriya_left
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
  - board: mriya_right

  # Донгл на nRF52840 (nice!nano v2): отдельная централь для USB/BLE + Studio.
  - board: nice_nano_v2
    shield: zmk_dongle
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y

  - board: nice_nano_v2
    shield: settings_reset
