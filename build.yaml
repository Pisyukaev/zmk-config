include:
  # Обе половинки работают как периферия и отправляют нажатия на донгл.
  - board: mriya_left
  - board: mriya_right

  # Донгл на nRF52840 (nice!nano v2) — центральное устройство + USB + ZMK Studio.
  - board: nice_nano_v2
    shield: zmk_dongle
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y

  - board: nice_nano_v2
    shield: settings_reset
